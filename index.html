.dlg-w{position:fixed;inset:0;z-index:85;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));background:var(--scrim);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade var(--d2) var(--ease) both}

/* command palette */

/* design notes: pins, spotlight and the note card */
.gbtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 10px;border-radius:18px;background:var(--ink);color:var(--card);border:0;font-weight:500;font-size:13px;white-space:nowrap;flex:none;transition:transform var(--d2) var(--ease),background-color var(--d2);margin-inline-start:4px}

.gbtn.lift .cnt{background:#191C2B;color:var(--fleck)}
.pins{position:absolute;inset:0 0 auto 0;height:0;z-index:60;pointer-events:none}
.pin{position:absolute;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--card);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--card),var(--sh-2);pointer-events:auto;cursor:pointer;border:0;animation:pinin 420ms var(--spring) both;animation-delay:calc(var(--k,0)*70ms)}
.pin::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--fleck);opacity:0;animation:ping 2.2s var(--ease) infinite;animation-delay:calc(var(--k,0)*250ms + 600ms)}
.pin.on{background:var(--fleck);color:#191C2B}
@keyframes pinin{from{opacity:0;transform:scale(.4)}}
.spot{position:absolute;z-index:58;border-radius:16px;box-shadow:0 0 0 9999px var(--scrim);pointer-events:none;transition:top var(--d3) var(--ease),left var(--d3) var(--ease),width var(--d3) var(--ease),height var(--d3) var(--ease),opacity var(--d2);outline:2px solid var(--fleck);outline-offset:3px}
.gcard{position:fixed;z-index:72;width:min(380px,calc(100vw - 32px));background:var(--card);border-radius:16px;box-shadow:var(--sh-3);padding:20px 20px 16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));animation:dlgin 360ms var(--ease) both}

.tasks .lr{grid-template-columns:32px minmax(0,1fr) 84px 72px;column-gap:12px;min-height:80px;padding:12px 24px;transition:background-color var(--d1),opacity var(--d3),transform var(--d3) var(--ease)}

/* Design system and visual identity: one long reference page, sections on cards, a sticky section bar. */
.pg-ds{display:flex;flex-direction:column;gap:24px}
.pg-ds .ds-hero{position:relative;overflow:hidden;padding:40px;border-radius:16px;background:radial-gradient(90% 120% at 100% 0%,var(--pri-soft) 0,transparent 62%),var(--card);box-shadow:var(--sh)}
.pg-ds .ds-pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:1px solid var(--line-2);border-radius:8px;background:var(--card);box-shadow:var(--ctl);font-size:16px;line-height:24px;color:var(--ink-2)}
.pg-ds .ds-pill svg{color:var(--ink-2)}
.pg-ds .ds-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 48px;margin:16px 0 32px;flex-wrap:wrap}
.pg-ds .ds-h{font-size:clamp(34px,4.6vw,56px);line-height:1.36;font-weight:400;text-wrap:balance;letter-spacing:-.2px}
.pg-ds .ds-h em{color:var(--pri)}
.pg-ds .ds-sub{max-width:560px;text-wrap:pretty}
.pg-ds .facts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--card)}
.pg-ds .facts>div{padding:16px 20px;min-width:0}
.pg-ds .facts>div+div{border-inline-start:1px solid var(--line)}
.pg-ds .facts b{display:block;font-weight:400;font-size:32px;line-height:40px;color:var(--ink)}
.pg-ds .facts span{font-size:13px;line-height:20px;color:var(--ink-3)}
.pg-ds .facts .acc b{color:var(--pri)}

/* section bar */
.pg-ds .ds-bar{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px));z-index:20;display:flex;gap:8px;overflow-x:auto;padding:12px 0;margin:-12px 0;background:linear-gradient(to bottom,var(--bg) 78%,transparent);scrollbar-width:none}
.pg-ds .ds-bar::-webkit-scrollbar{display:none}
.pg-ds .ds-bar .chip{height:32px;padding:0 12px;flex:none;background:var(--card)}
.pg-ds .ds-bar .chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.pg-ds .ds-bar .chip svg{color:currentColor}

/* sections */
.pg-ds .ds-sec{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:32px;scroll-margin-top:calc(var(--top-h) + 72px);min-width:0}
.pg-ds .ds-sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 32px;flex-wrap:wrap;margin-bottom:24px}
.pg-ds .ds-ey{font-size:13px;line-height:20px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.pg-ds .ds-t{font-size:24px;line-height:32px;margin-top:4px}
.pg-ds .ds-lead{font-size:14px;line-height:24px;color:var(--ink-2);max-width:620px;text-wrap:pretty}
.pg-ds .sub-t{font-size:13px;line-height:20px;color:var(--ink-3);margin:32px 0 12px}
.pg-ds .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pg-ds .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pg-ds .box{border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.pg-ds .box.soft{background:var(--soft);border-color:transparent}
.pg-ds .cap{font-size:12px;line-height:18px;color:var(--ink-3);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}

/* identity */
.pg-ds .id-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:stretch}
.pg-ds .stage{position:relative;min-height:340px;border-radius:12px;background:radial-gradient(circle,var(--line-2) 1px,transparent 1.4px) 0 0/16px 16px,var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pg-ds .stage .tools{position:absolute;top:12px;left:12px;display:flex;gap:8px}
.pg-ds .lgw{position:relative;width:168px;height:168px}
.pg-ds .lgw .logo{width:168px;height:168px;display:block;filter:drop-shadow(0 18px 30px rgba(64,84,236,.28))}
.pg-ds .guides{position:absolute;inset:0;width:100%;height:100%;overflow:visible;opacity:0;transition:opacity var(--d3) var(--ease);pointer-events:none}
.pg-ds .stage.show .guides{opacity:1}
.pg-ds .guides *{fill:none;stroke:var(--fleck);stroke-width:.35;stroke-dasharray:1.2 1.2;vector-effect:non-scaling-stroke}
.pg-ds .guides .solid{stroke-dasharray:none}
.pg-ds .stage .glab{position:absolute;font-size:12px;line-height:18px;color:var(--ink-2);background:var(--card);border-radius:4px;padding:2px 8px;box-shadow:var(--sh);opacity:0;transform:translateY(4px);transition:opacity var(--d3) var(--ease),transform var(--d3) var(--ease);white-space:nowrap}
.pg-ds .stage.show .glab{opacity:1;transform:none}
.pg-ds .cons{display:flex;flex-direction:column;gap:0}
.pg-ds .cons>div{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.pg-ds .cons>div:first-child{padding-top:0}
.pg-ds .cons>div:last-child{border-bottom:0}
.pg-ds .cons b{font-weight:500;display:block}
.pg-ds .cons p{font-size:13px;line-height:22px;color:var(--ink-3);margin-top:2px}
.pg-ds .use3 .box{display:flex;flex-direction:column;gap:12px}
.pg-ds .use3 .from{display:flex;align-items:center;gap:8px;font-size:13px;line-height:20px;color:var(--ink-3)}
.pg-ds .use3 .from svg{color:var(--ink-4)}
.pg-ds .use3 .demo{margin-top:auto;min-height:72px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.pg-ds .cornerdemo{height:72px;border-radius:16px;background:var(--card);box-shadow:var(--sh-2);position:relative;overflow:hidden;display:flex;align-items:center;padding:0 16px 0 72px;outline:1.5px dashed var(--pri-line);outline-offset:-1px}
.pg-ds .cornerdemo .cl{position:absolute;top:0;left:0;width:56px;height:56px}
.pg-ds .cornerdemo .cl svg{width:56px;height:56px;display:block}
.pg-ds .surf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.3fr);gap:16px}
.pg-ds .surf .tile2{height:120px;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(127,130,150,.18)}
.pg-ds .surf .tile2 svg{width:48px;height:48px}
.pg-ds .surf .lbl4{font-size:12px;line-height:18px;color:var(--ink-3);margin-top:8px}
.pg-ds .sizes{display:flex;align-items:flex-end;gap:20px;height:120px;padding:0 4px;flex-wrap:wrap}
.pg-ds .sizes>div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;line-height:18px;color:var(--ink-3)}
.pg-ds .clear{position:relative;padding:12px;border:1px dashed var(--pri-line);border-radius:4px}
.pg-ds .clear svg{width:48px;height:48px;display:block}

/* color */
.pg-ds .sw-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.pg-ds .swc{min-width:0}
.pg-ds .swb{display:block;width:100%;height:88px;border-radius:12px;border:0;box-shadow:inset 0 0 0 1px rgba(127,130,150,.2);cursor:pointer;position:relative;transition:transform var(--d2) var(--ease),box-shadow var(--d2)}
.pg-ds .swb:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(127,130,150,.2),var(--sh-2)}
.pg-ds .swb span{position:absolute;bottom:8px;left:8px;width:24px;height:24px;border-radius:6px;background:var(--card);color:var(--ink-2);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.8);transition:opacity var(--d2),transform var(--d2) var(--spring)}
.pg-ds .swb:hover span,.pg-ds .swb:focus-visible span{opacity:1;transform:none}
.pg-ds .swc b{display:block;font-weight:500;margin-top:10px}
.pg-ds .swc p{font-size:12px;line-height:18px;color:var(--ink-3);margin-top:2px;min-height:36px}
.pg-ds .hexr{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:28px;padding:0 8px;margin-top:6px;border:1px solid var(--line);border-radius:8px;background:none;font-size:12px;color:var(--ink-3);cursor:pointer;transition:border-color var(--d1),color var(--d1)}
.pg-ds .hexr:hover{border-color:var(--ink-4);color:var(--ink)}
.pg-ds .hexr .lat{color:var(--ink-2);font-size:12px}
.pg-ds .sem{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.pg-ds .sem .box{padding:16px;display:flex;flex-direction:column;gap:10px}
.pg-ds .sem .hd{display:flex;align-items:center;gap:8px;font-weight:500}
.pg-ds .sem .bar2{height:6px;border-radius:3px}
.pg-ds .sem .hx{display:flex;gap:6px;flex-wrap:wrap}
.pg-ds .sem .hx button{border:1px solid var(--line);border-radius:4px;background:none;padding:0 6px;height:22px;cursor:pointer;color:var(--ink-3);font-size:12px}
.pg-ds .sem .hx button:hover{border-color:var(--ink-4);color:var(--ink)}
.pg-ds .prop .ln{height:10px;gap:3px}
.pg-ds .prop .ln i{height:10px;border-radius:3px}
.pg-ds .prop .lg2{display:flex;gap:16px 24px;flex-wrap:wrap;margin-top:12px;font-size:13px;line-height:20px;color:var(--ink-2)}
.pg-ds .prop .lg2 span{display:flex;align-items:center;gap:8px}
.pg-ds .prop .lg2 i{width:10px;height:10px;border-radius:3px;display:block}

/* type */
.pg-ds .fam .big{font-size:56px;line-height:80px;letter-spacing:-.2px}
.pg-ds .fam .big.lat{font-size:44px;line-height:80px;font-weight:500}
.pg-ds .fam .wts{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--ink-3)}
.pg-ds .fam .wts span b{color:var(--ink);font-size:16px}
.pg-ds .ty{display:grid;grid-template-columns:120px minmax(0,1fr) 160px;align-items:baseline;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.pg-ds .ty:last-child{border-bottom:0}
.pg-ds .ty>span:first-child{font-size:12px;line-height:18px;color:var(--ink-3)}
.pg-ds .ty>span:nth-child(2){min-width:0;overflow-wrap:anywhere}
.pg-ds .ty>span:last-child{font-size:12px;line-height:18px;color:var(--ink-3);text-align:left}
.pg-ds .numr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pg-ds .numr .box{display:flex;flex-direction:column;gap:6px}
.pg-ds .numr .box>b{font-weight:500}
.pg-ds .numr .box>p{font-size:13px;line-height:22px;color:var(--ink-3)}
.pg-ds .ex{margin-top:10px;background:var(--soft);border-radius:8px;padding:12px 16px;min-width:0;overflow-x:auto}
.pg-ds .ex .stack{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:18px;line-height:28px}
.pg-ds .numr .seg{align-self:flex-start}
.pg-ds .seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--soft);border:1px solid var(--line);gap:2px}
.pg-ds .seg button{height:26px;padding:0 10px;border:0;border-radius:6px;background:none;font-size:12px;line-height:18px;color:var(--ink-3);transition:background-color var(--d2),color var(--d2),box-shadow var(--d2)}
.pg-ds .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}

/* space, radius, elevation */
.pg-ds .sp-row{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.pg-ds .sp-row>div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;line-height:18px;color:var(--ink-3);text-align:center;width:64px}
.pg-ds .sp-row .sq{height:32px;display:flex;align-items:flex-end;justify-content:center}
.pg-ds .sp-row i{display:block;background:var(--pri-pale);border-radius:2px;transition:transform var(--d2) var(--spring)}
.pg-ds .sp-row>div:hover i{transform:scale(1.15)}
.pg-ds .sp-row b{font-weight:500;color:var(--ink);font-size:13px}
.pg-ds .rad-row{display:flex;gap:16px;flex-wrap:wrap}
.pg-ds .rad-row>div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;line-height:18px;color:var(--ink-3);text-align:center;width:72px}
.pg-ds .sprad{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.pg-ds .rad-row i{display:block;width:56px;height:56px;border:1px solid var(--line-2);border-top-color:var(--pri);border-right-color:var(--pri);background:var(--card)}

.pg-ds .elev{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:8px}
.pg-ds .elev>div{background:var(--card);border-radius:16px;padding:20px;min-height:132px;transition:transform var(--d3) var(--ease)}
.pg-ds .elev>div:hover{transform:translateY(-4px)}
.pg-ds .elev b{display:block;font-weight:500;margin:8px 0 2px}
.pg-ds .elev p{font-size:13px;line-height:20px;color:var(--ink-3)}

/* components */
.pg-ds .cmps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pg-ds .cmp.span2{grid-column:span 2}
@media (max-width:1279px){.pg-ds .cmps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pg-ds .cmp{border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0;display:flex;flex-direction:column}
.pg-ds .cmp .row3{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pg-ds .cmp.wide{grid-column:1/-1}
.pg-ds .cmp .opts{grid-template-columns:minmax(0,1fr)}
.pg-ds .cmp .note2{font-size:12px;line-height:18px;color:var(--ink-3);margin-top:12px}
.pg-ds .cbl{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;border:0;background:none;padding:0}
.pg-ds .in.err{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.pg-ds .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pg-ds .opt{border:1px solid var(--line-2);border-radius:8px;padding:12px;position:relative;cursor:pointer;text-align:right;background:var(--card);transition:border-color var(--d2),box-shadow var(--d2)}
.pg-ds .opt:hover{border-color:var(--ink-4)}
.pg-ds .opt.on{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.pg-ds .opt .rd{position:absolute;top:12px;left:12px;width:16px;height:16px;border-radius:50%;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center}
.pg-ds .opt.on .rd{border-color:var(--pri)}
.pg-ds .opt .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--pri);transform:scale(0);transition:transform var(--d2) var(--spring)}
.pg-ds .opt.on .rd::after{transform:scale(1)}
.pg-ds .opt .w5{padding-inline-end:24px}
.pg-ds .lrow .lh,.pg-ds .lrow .lr{grid-template-columns:minmax(0,1fr) 120px 112px}
.pg-ds .lrow .lr{height:58px}

/* motion */
.pg-ds .dur{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pg-ds .dur .box{padding:16px;display:flex;flex-direction:column;gap:8px}
.pg-ds .dur .v{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pg-ds .dur .v .val{font-size:24px;line-height:32px;color:var(--ink)}
.pg-ds .dur p{font-size:13px;line-height:20px;color:var(--ink-3);flex:1}
.pg-ds .track{position:relative;height:24px;border-radius:12px;background:var(--soft);overflow:hidden}
.pg-ds .track::before{content:"";position:absolute;top:11px;right:12px;left:12px;height:2px;border-radius:1px;background:var(--line-2)}
.pg-ds .tdot{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;background:var(--pri);box-shadow:0 2px 6px rgba(64,84,236,.4)}
.pg-ds .curves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pg-ds .curve{display:flex;flex-direction:column;gap:12px}
.pg-ds .curve svg.plot{width:100%;height:auto;max-width:100%;display:block;background:var(--soft);border-radius:8px}
.pg-ds .plot .ax2{stroke:var(--line-2);stroke-width:1;fill:none}
.pg-ds .plot .gd{stroke:var(--line);stroke-width:1;fill:none;stroke-dasharray:3 3}

.pg-ds .plot .hd2{fill:var(--card);stroke:var(--ink-4);stroke-width:1}

.pg-ds .plot .pr{fill:var(--pri)}
.pg-ds .curve .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pg-ds .principles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pg-ds .principles .box b{display:block;font-weight:500;margin:10px 0 4px}
.pg-ds .principles .box p{font-size:13px;line-height:22px;color:var(--ink-3)}
.pg-ds .mot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.pg-ds .mlist{display:flex;flex-direction:column}
.pg-ds .mlist>div{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pg-ds .mlist>div:last-child{border-bottom:0}
.pg-ds .mlist b{font-weight:500;display:block}
.pg-ds .mlist p{font-size:13px;line-height:20px;color:var(--ink-3)}
.pg-ds .live{display:flex;flex-direction:column;gap:16px;align-self:start}
.pg-ds .live .bign{display:flex;align-items:baseline;gap:8px}
.pg-ds .live .rows2>div{display:flex;align-items:center;justify-content:space-between;gap:12px;height:40px;padding:0 12px;border-radius:8px;background:var(--card);border:1px solid var(--line);margin-bottom:6px;font-size:13px}
.pg-ds .live .rows2.go>div{animation:rowin .45s var(--ease) both}
.pg-ds .live .rows2.go>div:nth-child(2){animation-delay:70ms}
.pg-ds .live .rows2.go>div:nth-child(3){animation-delay:140ms}

/* icons */
.pg-ds .icg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.pg-ds .ict{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:96px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer;padding:8px;transition:transform var(--d2) var(--ease),box-shadow var(--d2),border-color var(--d2)}
.pg-ds .ict:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:var(--line-2)}
.pg-ds .ict .lat{font-size:11px;line-height:16px;color:var(--ink-3);max-width:100%;overflow:hidden;text-overflow:ellipsis}

/* voice */
.pg-ds .voice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pg-ds .vp{border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.pg-ds .vp .vh{padding:14px 20px;font-weight:500;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.pg-ds .vp .vh svg{color:var(--ink-3)}
.pg-ds .vp .vr{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;padding:14px 20px}
.pg-ds .vp .vr+.vr{border-top:1px dashed var(--line)}
.pg-ds .vp .vr .dot{margin-top:5px}
.pg-ds .vp .vr.no{color:var(--ink-3)}
.pg-ds .vp .vr small{display:block;font-size:12px;line-height:18px;color:var(--ink-3);margin-top:4px}

@media (max-width:1439px){
  .pg-ds .sw-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pg-ds .sem{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pg-ds .surf{grid-template-columns:repeat(3,minmax(0,1fr))}

}

/* ---------- numbers: Persian digits, decimal slash, tabular cells ---------- */
const FAD = '۰۱۲۳۴۵۶۷۸۹';
const fa = s => String(s).replace(/\d/g, d => FAD[d]);
const en = s => String(s).replace(/[۰-۹]/g, d => FAD.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const grp = n => Math.trunc(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const num = n => fa(grp(n));
const dec = (n, d = 2) => fa(Number(n).toFixed(d).replace(/\.?0+$/, '').replace('.', '/'));
const tabify = s => String(s).replace(/[۰-۹]/g, d => `<span class="dg">${d}</span>`).replace(/,/g, '<span class="cm">,</span>');
const money = n => `<span class="n tab" data-t="1">${tabify(num(n))}</span>`;
const parseNum = s => { const v = parseFloat(en(String(s)).replace(/[,٬\s]/g, '').replace('/', '.').replace('٫', '.')); return isNaN(v) ? 0 : v; };

function words(n) { // Persian number to words, rial amounts up to the trillions
  n = Math.trunc(n); if (n === 0) return 'صفر';
  const ones = ['', 'یک', 'دو', 'سه', 'چهار', 'پنج', 'شش', 'هفت', 'هشت', 'نه'];
  const teens = ['ده', 'یازده', 'دوازده', 'سیزده', 'چهارده', 'پانزده', 'شانزده', 'هفده', 'هجده', 'نوزده'];
  const tens = ['', '', 'بیست', 'سی', 'چهل', 'پنجاه', 'شصت', 'هفتاد', 'هشتاد', 'نود'];
  const huns = ['', 'یکصد', 'دویست', 'سیصد', 'چهارصد', 'پانصد', 'ششصد', 'هفتصد', 'هشتصد', 'نهصد'];
  const scale = ['', 'هزار', 'میلیون', 'میلیارد', 'هزار میلیارد'];
  const three = x => { const h = Math.floor(x / 100), r = x % 100, p = []; if (h) p.push(huns[h]);
    if (r >= 10 && r < 20) p.push(teens[r - 10]); else { if (Math.floor(r / 10)) p.push(tens[Math.floor(r / 10)]); if (r % 10) p.push(ones[r % 10]); }
    return p.join(' و '); };
  const parts = []; let i = 0;
  while (n > 0) { const c = n % 1000; if (c) parts.unshift(three(c) + (scale[i] ? ' ' + scale[i] : '')); n = Math.floor(n / 1000); i++; }
  return parts.join(' و ');
}

// Walks rendered text: Persian digits everywhere except codes and key caps; percent after the number.
function hyd(root) {
  if (!root) return root;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  for (const t of nodes) {
    const pe = t.parentElement; if (!pe || pe.closest('.code,kbd,.lat,script,style,textarea')) continue;
    if (!/[0-9]/.test(t.nodeValue)) continue;
    t.nodeValue = t.nodeValue.replace(/(\d)\.(?=\d)/g, '$1/').replace(/(\d)%/g, '$1؜٪').replace(/\d/g, d => FAD[d]);
    if (t.nodeValue.includes('٪') && pe.closest('.n')) pe.closest('.n').classList.add('rtl');
  }
  root.querySelectorAll('.tab:not([data-t])').forEach(e => { e.innerHTML = tabify(e.textContent); e.dataset.t = 1; });
  return root;
}

/* ---------- design notes: pins on the live page, a spotlight, one card ---------- */
const Guide = (() => {
  let on = false, idx = -1, layer, spot, card, ro;
  const notes = () => (Pages[current] && Pages[current].notes) || [];
  function button() {
    const b = html(`<button class="gbtn" id="gbtn" aria-label="نکات طراحی">${ic('pin', 16)}<span class="glbl">نکات طراحی</span><span class="cnt" id="gcnt"></span></button>`);
    $('#cmd').after(b); b.onclick = () => (on ? stop() : start());
  }
  function start() { on = true; $('#gbtn').classList.add('lift'); $('#gbtn .glbl').textContent = 'بستن نکات'; draw(); focus(0); }
  function stop() { on = false; idx = -1; $('#gbtn').classList.remove('lift'); $('#gbtn .glbl').textContent = 'نکات طراحی'; layer && layer.remove(); spot && spot.remove(); card && card.remove(); layer = spot = card = null; }
  function draw() {
    layer && layer.remove(); layer = html('<div class="pins" id="pins"></div>'); document.body.appendChild(layer);
    notes().forEach((n, i) => { const p = html(`<button class="pin" style="--k:${i}" aria-label="نکته ${i + 1}">${fa(i + 1)}</button>`); p.onclick = () => focus(i); layer.appendChild(p); });
    place();
  }
  function place() {
    if (!layer) return;
    const N = notes(), sx = scrollX, sy = scrollY;
    $$('.pin', layer).forEach((p, i) => { const t = $(N[i].at); if (!t || !t.getClientRects().length) { p.style.display = 'none'; return; }
      const r = t.getBoundingClientRect(); p.style.display = ''; p.style.left = (r.right + sx - 18) + 'px'; p.style.top = (r.top + sy - 10) + 'px'; p.classList.toggle('on', i === idx); });
    if (spot && idx >= 0) { const t = $(N[idx].at); if (t) { const r = t.getBoundingClientRect(); Object.assign(spot.style, { left: (r.left + sx - 6) + 'px', top: (r.top + sy - 6) + 'px', width: (r.width + 12) + 'px', height: (r.height + 12) + 'px' }); } }
  }
  function focus(i) {
    const N = notes(); if (!N.length) return; idx = (i + N.length) % N.length; const n = N[idx], t = $(n.at);
    if (t) t.scrollIntoView({ block: t.offsetHeight > innerHeight * .7 ? 'start' : 'center', behavior: reduced() ? 'auto' : 'smooth' });
    if (!spot) { spot = html('<div class="spot"></div>'); document.body.appendChild(spot); }
    card && card.remove();
    card = html(`<div class="gcard" role="dialog" aria-label="نکته طراحی"><div class="gh"><span class="tile-i">${ic(n.ic || 'pin', 16)}</span><div><div class="gn">نکته ${fa(idx + 1)} از ${fa(N.length)}، ${Pages[current].label}</div><div class="gt">${n.t}</div></div></div><p>${n.d}</p>
      <div class="gf"><div class="gd">${N.map((_, k) => `<i class="${k === idx ? 'on' : ''}"></i>`).join('')}</div><button class="btn sm" id="gprev">قبلی</button><button class="btn sm pri" id="gnext">${idx === N.length - 1 ? 'پایان' : 'بعدی'}</button></div></div>`);
    document.body.appendChild(card);
    if (t) { const r = t.getBoundingClientRect(), cx = r.left + r.width / 2; const sw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--side-w')) || 0;
      if (cx < innerWidth / 2 && r.width < innerWidth * .6) { card.style.right = (sw + 24) + 'px'; card.style.left = 'auto'; } else { card.style.left = '24px'; card.style.right = 'auto'; } }
    $('#gprev').onclick = () => focus(idx - 1); $('#gnext').onclick = () => idx === N.length - 1 ? stop() : focus(idx + 1);
    place(); setTimeout(place, 350); setTimeout(place, 700);
  }
  function refresh() {
    const c = $('#gcnt'); if (c) c.textContent = fa(notes().length);
    const b = $('#gbtn'); if (b) b.style.display = notes().length ? '' : 'none';
    if (on) { spot && spot.remove(); spot = null; card && card.remove(); card = null; idx = -1; if (notes().length) { draw(); setTimeout(() => focus(0), 500); } else stop(); }
  }
  function init() { button(); addEventListener('resize', place); ro = new ResizeObserver(() => place()); ro.observe(document.body); addEventListener('scroll', () => { if (on) place(); }, { passive: true }); }
  return { init, start, stop, refresh, place, get on() { return on; } };
})();

/* ---------- keyboard ---------- */
addEventListener('keydown', e => {
  const typing = e.target.closest && e.target.closest('input,textarea,[contenteditable]');
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K' || e.code === 'KeyK')) { e.preventDefault(); Palette.open(); return; }
  if (e.key === 'Escape') { if (openMenu) return closeMenu(); if (dialogs.length) return dialogs[dialogs.length - 1].close(); if (Guide.on) return Guide.stop(); closeNav(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || dialogs.length) return;
  if (e.code === 'KeyN') { e.preventDefault(); go('new-invoice'); }
  if (e.key === '/') { e.preventDefault(); Palette.open(); }
});

/* ---------- boot ---------- */
function boot() {
  const t = store.get('lj-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  shell(); themeIcon(); Guide.init(); badges();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { themeIcon(); emit('theme'); }); } catch (e) {}
  addEventListener('hashchange', () => { const h = fromHash(); if (h !== current) render(h); });
  let first = ''; try { first = location.hash.slice(1); } catch (e) {}
  render(fromHash());
  if (!first && !store.get('lj-intro', sessionStorage)) setTimeout(() => Intro.open(), 650);
}

    const stage = $('#stage', root), lgw = $('#lgw', root);
    const replay = () => { lgw.classList.remove('lg-anim'); void lgw.offsetWidth; lgw.classList.add('lg-anim'); };
    $('#lg-replay', root).onclick = replay;
    $('#lg-grid', root).onclick = e => { const on = stage.classList.toggle('show'); e.currentTarget.setAttribute('aria-pressed', on); };
    $('#usewhy', root).onclick = () => go('rejected');
    $('#cmpwhy', root).onclick = () => toast({ k: 'info', t: 'دلیل این پیشنهاد', b: 'میانگین زمان واکنش این خریدار در 12 صورتحساب قبلی 5.6 روز بوده است.' });

    // copy hex and icon names; toast samples
    root.addEventListener('click', e => {
      const h = e.target.closest('[data-hex]'); if (h) return copy(h.dataset.hex, 'کد رنگ کپی شد');
      const i = e.target.closest('[data-icon]'); if (i) return copy(i.dataset.icon, 'نام آیکن کپی شد');
      const t = e.target.closest('[data-toast]'); if (t) {
        const k = t.dataset.toast;
        if (k === 'ok') return toast({ k: 'ok', t: 'صورتحساب 1053 در صف ارسال قرار گرفت', b: 'ارسال بعدی ساعت ۱۲:۳۰' });
        if (k === 'warn') return toast({ k: 'warn', t: 'کد پستی خریدار وارد نشده', b: 'اختیاری است و جلوی ثبت را نمی‌گیرد.' });
        return toast({ k: 'bad', t: 'نهایی‌سازی ممکن نیست', b: 'شماره قرارداد پیمانکاری در الگوی چهارم اجباری است.' });
      }
    });

    // tabular digits demo
    $$('[data-tab]', root).forEach(b => b.onclick = () => {
      $$('[data-tab]', root).forEach(x => x.classList.toggle('on', x === b));
      const vals = [1109585400, 5608350000, 61050000], on = b.dataset.tab === '1';
      $('#tabex', root).innerHTML = vals.map(v => on ? money(v) : `<span class="n">${num(v)}</span>`).join('');
    });

    // components
    $('#busyb', root).onclick = async e => { const b = e.currentTarget; await busy(b, 1400, 'در حال استعلام'); toast({ k: 'ok', t: 'خریدار در سامانه مودیان فعال است', b: 'استعلام ساعت ۱۲:۰۸' }); };
    $$('[data-cb]', root).forEach(b => b.onclick = () => b.querySelector('.cb').classList.toggle('on'));
    $$('[data-opt]', root).forEach(b => b.onclick = () => $$('[data-opt]', root).forEach(x => x.classList.toggle('on', x === b)));
    $('#cmpmenu', root).onclick = e => menu(e.currentTarget, { head: 'ترتیب کارها', items: [{ label: 'ریسک', sub: 'رد و مهلت قانونی اول', checked: 1 }, { label: 'مهلت', sub: 'نزدیک‌ترین موعد اول' }, { label: 'مبلغ', sub: 'بیشترین مبلغ درگیر اول' }] });

    // motion
    const track = el => { const tr = el.parentElement; return Math.max(0, tr.clientWidth - el.offsetWidth - 8); };
    const run = (el, ms, easing) => { if (!el) return; const d = track(el); el.getAnimations().forEach(a => a.cancel());
      el.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${-d}px)` }], { duration: reduced() ? 1 : ms, easing, fill: 'forwards' }); };
    $$('[data-play-d]', root).forEach(b => b.onclick = () => run(b.parentElement.querySelector('.tdot'), +b.dataset.playD, 'cubic-bezier(.16,1,.3,1)'));
    $$('[data-play-c]', root).forEach(b => b.onclick = () => { const i = +b.dataset.playC; run($(`#cdot${i}`, root), dur, `cubic-bezier(${CUR[i][1].join(',')})`); });
    $$('[data-dur]', root).forEach(b => b.onclick = () => { dur = +b.dataset.dur; $$('[data-dur]', root).forEach(x => x.classList.toggle('on', x === b)); CUR.forEach((c, i) => run($(`#cdot${i}`, root), dur, `cubic-bezier(${c[1].join(',')})`)); });
    const live = () => {
      tween($('#livenum', root), 0, 8.46, v => dec(v), 900, false);
      const ln = $('#liveln', root); ln.classList.remove('anim'); void ln.offsetWidth; ln.classList.add('anim');
      const rw = $('#liverows', root); rw.classList.remove('go'); void rw.offsetWidth; rw.classList.add('go');
    };
    $('#liveplay', root).onclick = live;

    // section bar: scroll to a section, highlight the one in view
    const bar = $('.ds-bar', root), secs = SECS.map(s => $('#' + s[0], root));
    const off = () => { const t = document.querySelector('.top'); return (t ? t.getBoundingClientRect().bottom : 64) + bar.offsetHeight + 8; };
    $$('[data-sec]', bar).forEach(b => b.onclick = () => { const el = $('#' + b.dataset.sec, root); if (!el) return;
      scrollTo({ top: el.getBoundingClientRect().top + scrollY - off() + 4, behavior: reduced() ? 'auto' : 'smooth' }); });
    let last = '', raf = 0;
    const spy = () => { raf = 0; const y = off() + 24; let cur = secs[0];
      for (const s of secs) if (s && s.getBoundingClientRect().top <= y) cur = s;
      if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = secs[secs.length - 1];
      const id = cur ? cur.id : ''; if (id === last) return; last = id;
      $$('[data-sec]', bar).forEach(b => { const on = b.dataset.sec === id; b.classList.toggle('on', on);
        if (on && bar.scrollWidth > bar.clientWidth) { const br = bar.getBoundingClientRect(), cr = b.getBoundingClientRect(); if (cr.left < br.left || cr.right > br.right) bar.scrollBy({ left: cr.left - br.left - (br.width - cr.width) / 2, behavior: 'smooth' }); } }); };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(spy); };
    addEventListener('scroll', onScroll, { passive: true }); spy();
    return () => { removeEventListener('scroll', onScroll); if (raf) cancelAnimationFrame(raf); };
  }

  page('design-system', {
    label: 'سیستم طراحی', nav: 'ds', render, mount,
    notes: [
      { at: '[data-note="1"]', ic: 'layers', t: 'یک جدول برای همه صفحه‌ها', d: 'دو وزن حروف، هفت اندازه، شش فاصله و سه گوشه. هر عدد در رابط از همین جدول می‌آید و همین یکدستی صفحه‌ها را آرام نگه می‌دارد.' },
      { at: '[data-note="2"]', ic: 'pin', t: 'نشانه‌ای که در رابط کار می‌کند', d: 'خطوط لوگو نوار وضعیت شده‌اند و نقطه طلایی نشانه دستیار است. «ساختار» را بزنید تا شبکه ساخت لوگو را ببینید.' },
      { at: '[data-note="3"]', ic: 'hash', t: 'عدد، مهم‌ترین متن', d: 'ارقام فارسی در خانه‌های هم‌عرض، ممیز با اسلش، کدها لاتین و جدا، و مبلغ همیشه ریال. «بدون آن» را بزنید تا تفاوت ستون‌ها را ببینید.' },
      { at: '[data-note="4"]', ic: 'zap', t: 'حرکت برای توضیح تغییر', d: 'چهار مدت و سه منحنی، همه از یک جدول. هر منحنی را پخش کنید؛ کاربرانی که کاهش حرکت را روشن کرده‌اند حرکتی نمی‌بینند.' }
    ]
  });
})();

;boot();
</script>
