# nginx for demo.mouneskhah.com: static interactive demo (Lajvard v2), one index.html in /var/www/demo.
# Certificate: Let's Encrypt (webroot /var/www/letsencrypt), renewed by certbot.timer.
server {
    listen 80;
    listen [::]:80;
    server_name demo.mouneskhah.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://demo.mouneskhah.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.mouneskhah.com;

    ssl_certificate /etc/letsencrypt/live/demo.mouneskhah.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.mouneskhah.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    root /var/www/demo;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
